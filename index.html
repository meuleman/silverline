<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silverline Software</title>
<meta name="description" content="Small, careful software. No ads, no accounts, no tracking.">
<style>
  :root { --bg:#0D101C; --ink:#F2F4F8; --dim:#9AA1B8; --accent:#FFC41E; --line:#23283A; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6; padding:4rem 1.5rem 6rem;
  }
  main { max-width:40rem; margin:0 auto; }
  h1 { font-size:clamp(2rem,7vw,2.75rem); letter-spacing:-0.02em; margin:0 0 .5rem; }
  .tagline { color:var(--dim); font-size:1.1rem; margin:0 0 4rem; }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.12em; color:var(--dim);
       font-weight:600; margin:0 0 1.25rem; }
  .product { display:block; text-decoration:none; color:inherit; border:1px solid var(--line);
             border-radius:6px; padding:1.5rem; transition:border-color .15s; }
  .product:hover { border-color:var(--accent); }
  .product-head { display:flex; align-items:center; gap:1rem; margin-bottom:.5rem; }
  .product-head svg { width:40px; flex:none; }
  .product-name { font-size:1.25rem; font-weight:700; }
  .product p { margin:0; color:var(--dim); }
  footer { max-width:40rem; margin:5rem auto 0; padding-top:2rem; border-top:1px solid var(--line);
           color:var(--dim); font-size:.9rem; }
  footer a { color:var(--accent); text-decoration:none; }
  footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <h1>Silverline Software</h1>
  <p class="tagline">Small, careful software. No ads, no accounts, no tracking.</p>

  <h2>Products</h2>
  <a class="product" href="/placard/">
    <div class="product-head">
      <svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="rotate(-9 54 67)" fill="#FFC41E">
          <rect x="13" y="21" width="82" height="42" rx="4"/>
          <rect x="50" y="60" width="8" height="34"/>
        </g>
        <g transform="rotate(-9 54 67)" fill="#0D101C">
          <rect x="22" y="31" width="64" height="8" rx="3"/>
          <rect x="22" y="45" width="40" height="8" rx="3"/>
        </g>
      </svg>
      <span class="product-name">Placard</span>
    </div>
    <p>Turns your screen into a sign that says “I’m here”. For Android.</p>
  </a>
</main>
<footer>
  <p>Silverline Software · Seattle, WA U.S.A. · <a href="mailto:softwaresilverline@gmail.com">softwaresilverline@gmail.com</a></p>
</footer>
</body>
</html>
